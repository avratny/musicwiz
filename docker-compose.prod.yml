# MusicWiz – Betrieb (z. B. als Stack in Dockge). Das Image baut GitHub Actions bei jedem Push.
# Werte in der .env des Stacks setzen (siehe README):
#   MUSIC_SHARE=/mnt/music   INBOX_SHARE=/mnt/inbox   PUID=1000   PGID=1000   MUSICWIZ_PORT=8000
x-env: &env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Europe/Vienna}
  APP_URL: ${APP_URL:-http://localhost:8000}
  # Speichergrenze je PHP-Prozess (bei viel RAM z. B. 2G) und gleichzeitige Leseprozesse beim Scan
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
  PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-120}
  MUSIC_SCAN_WORKERS: ${MUSIC_SCAN_WORKERS:-4}
  # Startwerte – gepflegt wird alles in der App unter Einstellungen
  MUSIC_BASE: /music
  MUSIC_INBOX: /inbox
  MUSIC_TRASH: /music/_papierkorb
  MUSIC_ARTIST_IMAGES: /music/_artists

x-app: &app
  image: ghcr.io/avratny/musicwiz:${MUSICWIZ_TAG:-latest}
  restart: unless-stopped
  environment: *env
  volumes:
    - ${MUSIC_SHARE:?MUSIC_SHARE fehlt}:/music
    - ${INBOX_SHARE:-./inbox}:/inbox
    # Datenbank, Schlüssel, Sicherungen fürs Rückgängigmachen, Cache – bleibt bei Updates erhalten
    - ./data:/app/storage/app

services:
  app:
    <<: *app
    ports:
      - "${MUSICWIZ_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: ["frankenphp", "php-server", "--listen", ":8080", "--root", "/app/public"]

  # Verschieben, Tags schreiben, Scans
  queue:
    <<: *app
    environment:
      <<: *env
      RUN_MIGRATIONS: "0"
    healthcheck:
      disable: true
    command: ["php", "artisan", "queue:work", "--queue=default,research", "--sleep=1", "--tries=1", "--timeout=0"]
    # bei Update/Neustart die laufende Aktion zu Ende bringen lassen statt sie nach 10 s hart abzubrechen
    stop_grace_period: 2m
    depends_on:
      app:
        condition: service_healthy

  # YouTube-Downloads (eigene Warteschlange, damit sie andere Aktionen nicht aufhalten)
  downloads:
    <<: *app
    environment:
      <<: *env
      RUN_MIGRATIONS: "0"
    healthcheck:
      disable: true
    command: ["php", "artisan", "queue:work", "--queue=downloads", "--sleep=1", "--tries=1", "--timeout=0"]
    depends_on:
      app:
        condition: service_healthy
