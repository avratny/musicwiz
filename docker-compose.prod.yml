# MusicWiz – Betrieb (z. B. als Stack in Dockge). Das Image baut GitHub Actions bei jedem Push.
# Werte in der .env des Stacks setzen (siehe README):
#   MUSIC_SHARE=/mnt/music   INBOX_SHARE=/mnt/inbox   PUID=1000   PGID=1000   MUSICWIZ_PORT=8000
#   DB_PASSWORD=…   DB_ROOT_PASSWORD=…   MUSICWIZ_TAG=1.0.0-beta   DB_BUFFER_POOL=2G
x-env: &env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  # optional: weitere Gruppen mit Zugriff aufs Share, z. B. "100,1001"
  PGROUPS: ${PGROUPS:-}
  TZ: ${TZ:-Europe/Vienna}
  APP_URL: ${APP_URL:-http://localhost:8000}
  # Speichergrenze je PHP-Prozess (bei viel RAM z. B. 2G) und gleichzeitige Leseprozesse beim Einlesen
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
  PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-120}
  MUSIC_SCAN_WORKERS: ${MUSIC_SCAN_WORKERS:-4}
  # Schnittstelle /api (Analyse und Aktionen von außen, z. B. eine KI) – leer = offen, gesetzt = nur mit Token
  API_TOKEN: ${API_TOKEN:-}
  # Datenbank (eigener Container „db“)
  DB_CONNECTION: mariadb
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: musicwiz
  DB_USERNAME: musicwiz
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
  # Bereiche (Ordner im Container): Lib, Blackhole und Papierkorb im Musik-Share, die Inbox als eigenes Share
  MUSIC_LIBRARY: ${MUSIC_LIBRARY:-/music/library}
  MUSIC_BLACKHOLE: ${MUSIC_BLACKHOLE:-/music/blackhole}
  MUSIC_TRASH: ${MUSIC_TRASH:-/music/_papierkorb}
  MUSIC_INBOX: ${MUSIC_INBOX:-/inbox}
  MUSIC_ARTIST_IMAGES: ${MUSIC_ARTIST_IMAGES:-/music/_artists}

x-app: &app
  image: ghcr.io/avratny/musicwiz:${MUSICWIZ_TAG:-latest}
  restart: unless-stopped
  environment: *env
  volumes:
    - ${MUSIC_SHARE:?MUSIC_SHARE fehlt}:/music
    - ${INBOX_SHARE:-./inbox}:/inbox
    # Schlüssel, Cover-Speicher, Vorschaubilder, Logs – bleibt bei Updates erhalten
    - ./data:/app/storage/app

# Worker ohne Migrationen und ohne Healthcheck, starten erst, wenn die App läuft (die migriert)
x-worker: &worker
  <<: *app
  environment:
    <<: *env
    RUN_MIGRATIONS: "0"
  healthcheck:
    disable: true
  depends_on:
    app:
      condition: service_healthy

services:
  # Datenbank – Daten auf der lokalen Platte des Docker-Hosts (nicht auf dem NFS-Share)
  db:
    image: mariadb:11
    restart: unless-stopped
    # Zwischenspeicher der Datenbank: Vorgabe von MariaDB sind 128 MB – die Lieder-Tabelle allein ist bei großer
    # Bibliothek mehrere hundert MB, dann liest jede Abfrage von der Platte. Ruhig größer, wenn der Host RAM hat.
    command: ["--innodb-buffer-pool-size=${DB_BUFFER_POOL:-2G}"]
    environment:
      MARIADB_DATABASE: musicwiz
      MARIADB_USER: musicwiz
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD fehlt}
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - ./db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    <<: *app
    ports:
      - "${MUSICWIZ_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    command: ["frankenphp", "php-server", "--listen", ":8080", "--root", "/app/public"]
    depends_on:
      db:
        condition: service_healthy

  # Einlesen, Schreiben (Tags, Verschieben), ReplayGain, Fingerabdrücke – genau ein Worker, damit Datei-Aktionen strikt
  # nacheinander laufen
  queue:
    <<: *worker
    command: ["php", "artisan", "queue:work", "--queue=default", "--sleep=1", "--tries=1", "--timeout=0"]
    # bei Update/Neustart die laufende Aktion zu Ende bringen lassen statt sie nach 10 s hart abzubrechen
    stop_grace_period: 2m

  # Abgleich der Interpreten (MusicBrainz, Spotify …) – eigener Worker, damit Einlesen nie wartet; „lookup-now“
  # (einzelner Interpret) kommt vor dem nächsten Paket des großen Abgleichs dran. Mehr als einer bringt nichts
  # (MusicBrainz erlaubt eine Abfrage pro Sekunde).
  lookup:
    <<: *worker
    command: ["php", "artisan", "queue:work", "--queue=lookup-now,lookup", "--sleep=1", "--tries=1", "--timeout=0"]
    stop_grace_period: 1m

  # Vorschaubilder des Abgleichs – eigener Worker, damit der Abgleich nicht auf Bild-Downloads wartet
  images:
    <<: *worker
    command: ["php", "artisan", "queue:work", "--queue=images", "--sleep=1", "--tries=1", "--timeout=0"]
    stop_grace_period: 30s
