# Baut das Betriebs-Image (docker/Dockerfile, Ziel prod) und legt es in der GitHub Container Registry ab:
#   Push auf main      → ghcr.io/avratny/musicwiz:latest (+ :sha-…)
#   Tag v1.2.3(-beta…) → :1.2.3 bzw. :1.2.3-beta.1 (+ :1.2 bei stabilen Versionen)
name: Docker-Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          # Server ist x86-64; für ARM hier linux/arm64 ergänzen (und docker/setup-qemu-action davor)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
