# Entwicklung: Code wird eingebunden, Musik liegt in ./demofiles
# Start/Stopp über ./dev.sh
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: base
    args:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
  image: musicwiz-dev
  volumes:
    - ./:/app
    - ./demofiles:/music
  environment:
    DB_CONNECTION: mariadb
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: musicwiz
    DB_USERNAME: musicwiz
    DB_PASSWORD: musicwiz
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: musicwiz
      MARIADB_USER: musicwiz
      MARIADB_PASSWORD: musicwiz
      MARIADB_ROOT_PASSWORD: musicwiz-root
    volumes:
      - dbdata:/var/lib/mysql
      # zweite Datenbank für die Tests
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${DB_PORT_HOST:-3307}:3306"

  app:
    <<: *app
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["frankenphp", "php-server", "--listen", ":8080", "--root", "/app/public"]
    ports:
      - "${APP_PORT:-8000}:8080"

  # Einlesen (und später Schreiben) im Hintergrund – listen statt work: Codeänderungen greifen ohne Neustart
  queue:
    <<: *app
    healthcheck:
      disable: true
    command: ["php", "artisan", "queue:listen", "--queue=default", "--sleep=1", "--tries=1", "--timeout=0"]
    stop_grace_period: 30s

  # Abgleich der Interpreten (MusicBrainz, Spotify …) – eigener Worker, damit Einlesen nie wartet;
  # „lookup-now“ (einzelner Interpret) kommt vor dem nächsten Paket des großen Abgleichs dran
  lookup:
    <<: *app
    healthcheck:
      disable: true
    command: ["php", "artisan", "queue:listen", "--queue=lookup-now,lookup", "--sleep=1", "--tries=1", "--timeout=0"]
    stop_grace_period: 30s

  # Vorschaubilder des Abgleichs – eigener Worker, damit der Abgleich nicht auf Bild-Downloads wartet
  images:
    <<: *app
    healthcheck:
      disable: true
    command: ["php", "artisan", "queue:listen", "--queue=images", "--sleep=1", "--tries=1", "--timeout=0"]
    stop_grace_period: 30s

  assets:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npx vite build --watch"]

volumes:
  dbdata:
